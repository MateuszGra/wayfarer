# Local development only. Production runs on MyDevil (its Node.js and PostgreSQL).
services:
  app:
    image: node:26-slim
    working_dir: /app
    # Dependencies are installed inside the container into their own volume: native packages
    # (rolldown, esbuild) need Linux binaries, not the ones installed on the host Mac.
    command: sh -c "npm ci --no-audit --no-fund && npm run db:migrate && npm run dev"
    environment:
      DATABASE_URL: postgres://wayfarer:wayfarer@db:5432/wayfarer
      TEST_DATABASE_URL: postgres://wayfarer:wayfarer@db:5432/wayfarer_test
      PORT: '3000'
    ports:
      - '${WEB_PORT:-5173}:5173'
      - '${API_PORT:-3000}:3000'
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wayfarer
      POSTGRES_PASSWORD: wayfarer
      POSTGRES_DB: wayfarer
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wayfarer -d wayfarer']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  node-modules:
